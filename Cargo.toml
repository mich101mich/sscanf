[package]
name = "sscanf"
version = "0.5.0"
authors = ["mich101mich <mich101mich@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
description = "A sscanf (inverse of format!()) macro with near unlimited parsing capabilities"
repository = "https://github.com/mich101mich/sscanf"
readme = "Readme.md"
license = "MIT OR Apache-2.0"
keywords = ["parsing", "regex", "text", "string", "scanf"]
categories = ["parsing"]
exclude = ["/.vscode", "/.gitignore", "/.github", "/*.bat", "/*.sh", "/todo.md", "/submodules", "/.gitmodules"]

[workspace]
members = ["sscanf_macro"]

[dependencies]
sscanf_macro = { path = "sscanf_macro", version = "=0.5.0" }
regex-automata = "0.4.0" # Note when updating: regex-automata depends on regex-syntax, and the versions have to match
regex-syntax = "0.8.0" # Should match regex-syntax in sscanf_macro/Cargo.toml

[dev-dependencies]
err_span_check = "0.1.1"
rustc_version = "0.4.0"
